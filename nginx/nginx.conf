server {
    listen 80;
    server_name localhost;

    # Максимальный размер загружаемого файла (чтобы файлы > 2МБ не резались на входе)
    client_max_body_size 500M;

    # 1. ИСПРАВЛЕНО: Раздача статики собранного React-фронтенда вместо прокси к video_service
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Перенаправляет все запросы на index.html, чтобы React-роутер не ломался
        try_files $uri $uri/ /index.html;
    }

    # 2. Перенаправление запросов авторизации на auth_service
    location /auth {
        proxy_pass http://auth_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Передаем куки авторизации от Google OAuth
        proxy_pass_header Set-Cookie;
    }
    location /users {
        proxy_pass http://auth_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Передаем куки авторизации от Google OAuth
        proxy_pass_header Set-Cookie;
    }
    location /profile {
        proxy_pass http://video_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Передаем куки авторизации от Google OAuth
        proxy_pass_header Set-Cookie;
    }

    # 3. Перенаправление запросов к API видео-эндпоинтов
    location /video {
        proxy_pass http://video_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /comments {
        proxy_pass http://video_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Перенаправление запросов к сервису каналов
    location /channels {
        proxy_pass http://channels_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /subscriptions {
        proxy_pass http://channels_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /storage {
        proxy_pass http://channels_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}