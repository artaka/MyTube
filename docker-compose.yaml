services:
  postgres_db:
    image: postgres:15-alpine
    container_name: mytube_postgres
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: mytube_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mytube_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d mytube_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Админка RabbitMQ (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - mytube_network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - mytube_network

  # --- S3 Хранилище MinIO ---
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"       # API S3
      - "9001:9001"       # Консоль управления в браузере (minioadmin/minioadminpassword)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - mytube_network

  # --- Микросервис авторизации ---
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: mytube_auth
    volumes:
      - ./auth_service:/app
    ports:
      - "8001:8000"
    environment:
      DB_URL: "postgresql+asyncpg://postgres_user:postgres_password@postgres_db:5432/mytube_db"
      SECRET_KEY: "111"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
    depends_on:
      postgres_db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - mytube_network

  # --- Микросервис работы с видео (бывший web) ---
  video_service:
    build:
      context: ./video_service  # Указываем на папку видеосервиса
      dockerfile: Dockerfile
    container_name: mytube_video
    ports:
      - "8002:8000"
    volumes:
      - ./video_service:/app    # Маппим локальный код для авторелоада (uvicorn --reload)
    environment:
      DB_URL: "postgresql+asyncpg://postgres_user:postgres_password@video_db:5432/mytube_db"
      SECRET_KEY: "111"
      PYTHONPATH: "/app"
      AUTH_SERVICE_URL: "http://auth_service:8000"
      CELERY_BROKER_URL: "amqp://guest:guest@rabbitmq:5672//"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_EXTERNAL_ENDPOINT: "localhost:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadminpassword"
    depends_on:
      - rabbitmq
      - redis
      - minio
      - auth_service
      - video_db
    # Для разработки используем uvicorn с флагом --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - mytube_network

  video_db:
    image: postgres:15-alpine
    container_name: video_postgres
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: mytube_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_video_data:/var/lib/postgresql/data
    networks:
      - mytube_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_user -d mytube_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Celery Воркер (для тяжелых задач с FFmpeg) ---
  celery_worker:
    build:
      context: ./video_service  # Воркер собирается из той же папки и с тем же FFmpeg внутри!
      dockerfile: Dockerfile
    container_name: celery_worker
    volumes:
      - ./video_service:/app    # Код воркера тоже будет обновляться на лету
    environment:
      DB_URL: "postgresql+asyncpg://postgres_user:postgres_password@video_db:5432/mytube_db"
      SECRET_KEY: "111"
      PYTHONPATH: "/app"
      AUTH_SERVICE_URL: "http://auth_service:8000"
      CELERY_BROKER_URL: "amqp://guest:guest@rabbitmq:5672//"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_EXTERNAL_ENDPOINT: "localhost:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadminpassword"
    depends_on:
      - rabbitmq
      - redis
      - minio
    command: python -m celery -A app.utils.tasks.celery_app worker --loglevel=info
    networks:
      - mytube_network

  gateway:
    build:
      context: ./frontend # Собираем Nginx + React прямо здесь
      dockerfile: Dockerfile
    container_name: mytube_gateway
    ports:
      - "80:80"
    volumes:
      # Пробрасываем только конфиг, статика уже внутри образа!
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth_service
      - video_service
      - channels_service
    networks:
      - mytube_network

  # --- База данных каналов ---
  channels_db:
    image: postgres:15-alpine
    container_name: channels_postgres
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: mytube_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_channels_data:/var/lib/postgresql/data
    networks:
      - mytube_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_user -d mytube_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Микросервис каналов ---
  channels_service:
    build:
      context: ./channels_service
      dockerfile: Dockerfile
    container_name: mytube_channels
    ports:
      - "8003:8000"
    volumes:
      - ./channels_service:/app
    environment:
      DB_URL: "postgresql+asyncpg://postgres_user:postgres_password@channels_db:5432/mytube_db"
      SECRET_KEY: "111"
      PYTHONPATH: "/app"
      AUTH_SERVICE_URL: "http://auth_service:8000"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_EXTERNAL_ENDPOINT: "http://localhost:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadminpassword"
      BUCKET_NAME: "photos"
      REGION_NAME: "us-east-1"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672//"
    depends_on:
      channels_db:
        condition: service_healthy
      auth_service:
        condition: service_started
      rabbitmq:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - mytube_network

volumes:
  postgres_data:
  minio_data:
  postgres_video_data:
  postgres_channels_data:

networks:
  mytube_network:
    driver: bridge